services:
  - type: web
    name: veripixel-ai
    env: python
    buildCommand: |
      pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10
    aptPackages:
      - libgl1
      - libglib2.0-0
      - libsm6
      - libxext6
      - libxrender1
      - libxcb1
